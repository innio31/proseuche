<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Proseuche</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/styles.css" />

  <link rel="preconnect" href="https://impactdigitalacademy.com.ng" />

      </a>
      <a href="#/bible">

      </a>

      "imports": {
        "./api.js": "./js/api.js",
        "./app.js": "./js/app.js",
        "./db-local.js": "./js/db-local.js",
